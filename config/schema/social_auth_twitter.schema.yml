social_auth_twitter.settings:
  type: config_object
  label: 'Social Auth Twitter settings'
  mapping:
    client_id:
      type: text
      label: 'Client Key'
    client_secret:
      type: text
      label: 'Client Secret'
    scopes:
      type: string
      label: 'Scopes to be requested'
    endpoints:
      type: string
      label: 'API endpoints to be requested'
